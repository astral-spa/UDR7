name: Pubblica sito mappe

on:
  push:
    branches: [main]
    paths: ["sito-mappe/**", "*.zip", ".github/workflows/pages-mappe.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # serve la storia git per scegliere lo zip GTFS più recente
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rigenera il sito dal GTFS
        run: |
          python3 sito-mappe/build_data.py
          # online va solo la pagina: niente script, modello, README o GTFS
          mkdir -p _site
          cp sito-mappe/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
